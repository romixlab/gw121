[workspace]
resolver = "3"
members = ["crates/gw121", "crates/gw121_cli", "crates/gw121_py"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Roman Isaikin <roman@vhrd.tech>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/romixlab/gw121_cli"
rust-version = "1.88"

[workspace.dependencies]
gw121 = { path = "crates/gw121", version = "0.2.0" }
anyhow = "1"
bluer = { version = "0.17", default-features = false, features = ["bluetoothd"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "6"
futures-util = "0.3"
indicatif = "0.18"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

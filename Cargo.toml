[package]
name = "gw121_cli"
version = "0.1.0"
edition = "2024"
description = "CLI and agent skill for the EEVblog 121GW multimeter over Bluetooth LE"
authors = ["Roman Isaikin <roman@vhrd.tech>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/romixlab/gw121_cli"
readme = "README.md"
keywords = ["eevblog", "121gw", "multimeter", "ble", "cli"]
categories = ["command-line-utilities", "hardware-support", "development-tools::debugging"]
rust-version = "1.88"

[[bin]]
name = "gw121"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bluer = { version = "0.17", default-features = false, features = ["bluetoothd"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "6"
futures-util = "0.3"
indicatif = "0.18"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
